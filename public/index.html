<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Viral Content & Script Generator | AI Studio</title>
<style>
  :root {
    --bg: #0b0f19;
    --bg-soft: #151a2a;
    --card: #1c2238;
    --card-border: #2a314d;
    --primary: #7c5cff;
    --primary-2: #ff5c93;
    --accent: #00e5ff;
    --text: #ffffff;
    --text-dim: #9aa0c3;
    --success: #00e676;
    --danger: #ff1744;
    --radius: 16px;
    --shadow: 0 12px 40px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(1000px 600px at 10% -10%, rgba(124,92,255,0.15), transparent),
      radial-gradient(800px 500px at 100% 10%, rgba(255,92,147,0.1), transparent),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 50px 20px 80px;
  }

  header.hero {
    text-align: center;
    margin-bottom: 40px;
  }

  header.hero .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(124,92,255,0.3);
  }

  header.hero h1 {
    font-size: 38px;
    font-weight: 800;
    margin: 0 0 15px;
    background: linear-gradient(90deg, #ffffff, #b3b0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header.hero p {
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1.5;
    max-width: 600px;
    margin: 0 auto;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px;
    backdrop-filter: blur(10px);
  }

  .form-card { margin-bottom: 30px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  input[type="text"], select, textarea {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-soft);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  input[type="text"]:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(124,92,255,0.15);
    background: #191f33;
  }

  select { cursor: pointer; }
  textarea { resize: vertical; min-height: 80px; }

  .counter {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
    text-align: right;
  }
  .counter.warn { color: var(--danger); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn:active { transform: translateY(2px); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-primary {
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    color: #fff;
    width: 100%;
    margin-top: 24px;
    font-size: 16px;
    box-shadow: 0 8px 25px rgba(124,92,255,0.4);
  }
  .btn-primary:hover:not(:disabled) { 
    box-shadow: 0 12px 30px rgba(124,92,255,0.6); 
    filter: brightness(1.1);
  }

  .btn-ghost {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 8px 14px;
    font-size: 13px;
  }
  .btn-ghost:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--text);
    background: rgba(124,92,255,0.1);
  }

  .btn-small { padding: 6px 12px; font-size: 12px; }

  .results { display: none; margin-top: 30px; }
  .results.visible { display: block; animation: fadeIn 0.5s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-card {
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }

  .section-title .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .section-body {
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 15px;
    color: #e2e8f0;
    min-height: 30px;
  }

  .hashtag-chip {
    background: rgba(124,92,255,0.15);
    border: 1px solid rgba(124,92,255,0.3);
    color: #c9c6ff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
    display: inline-block;
    margin: 4px;
    transition: all 0.2s;
  }
  .hashtag-chip:hover {
    background: var(--primary);
    color: #fff;
  }

  .skeleton {
    background: linear-gradient(90deg, var(--bg-soft) 25%, #232847 37%, var(--bg-soft) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 6px;
    height: 16px;
    margin-bottom: 10px;
  }
  .skeleton:last-child { width: 70%; }
  
  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--primary);
    color: #fff;
    padding: 14px 24px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    font-size: 15px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 768px) {
    .field-row { grid-template-columns: 1fr; gap: 15px; }
    header.hero h1 { font-size: 28px; }
    .wrap { padding: 30px 15px 60px; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="badge">AI Creator Studio</span>
      <h1>Viral Content Generator</h1>
      <p>Turn any product or idea into a ready-to-post viral script, title, and hashtags in seconds.</p>
    </header>

    <section class="card form-card">
      <label for="topic">What is your video about?</label>
      <input type="text" id="topic" maxlength="200" placeholder="e.g. 5 tips for glowing skin, New cafe opening in Surat..." />
      <div class="counter" id="topicCounter">0 / 200</div>

      <div class="field-row">
        <div>
          <label for="language">Language</label>
          <select id="language">
            <option value="English">English</option>
            <option value="Gujarati" selected>Gujarati</option>
            <option value="Hindi">Hindi</option>
            <option value="Marathi">Marathi</option>
          </select>
        </div>
        <div>
          <label for="platform">Platform</label>
          <select id="platform">
            <option value="Instagram Reels" selected>Instagram Reels</option>
            <option value="YouTube Shorts">YouTube Shorts</option>
            <option value="TikTok">TikTok</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary" id="generateBtn">
        <span id="generateBtnLabel">✨ Generate Viral Content</span>
      </button>
    </section>

    <div id="emptyState" class="card empty-state" style="border: 1px dashed var(--card-border); background: transparent;">
      Enter a topic above and click generate to see the magic! 🚀
    </div>

    <section class="results" id="results">
      <!-- Idea Section -->
      <div class="card section-card">
        <div class="section-head">
          <div class="section-title"><span class="dot"></span> Viral Concept</div>
          <button class="btn btn-ghost btn-small" data-copy="idea">📋 Copy</button>
        </div>
        <div class="section-body" id="out-idea"></div>
      </div>

      <!-- Hook Section -->
      <div class="card section-card">
        <div class="section-head">
          <div class="section-title"><span class="dot" style="background: #ff5c93; box-shadow: 0 0 10px #ff5c93;"></span> Video Hook (First 3 Seconds)</div>
          <button class="btn btn-ghost btn-small" data-copy="hook">📋 Copy</button>
        </div>
        <div class="section-body" id="out-hook"></div>
      </div>

      <!-- Script Section -->
      <div class="card section-card">
        <div class="section-head">
          <div class="section-title"><span class="dot" style="background: #7c5cff; box-shadow: 0 0 10px #7c5cff;"></span> Full Script</div>
          <button class="btn btn-ghost btn-small" data-copy="script">📋 Copy</button>
        </div>
        <div class="section-body" id="out-script"></div>
      </div>
      
      <!-- Title & Hashtags Section -->
      <div class="card section-card">
        <div class="section-head">
          <div class="section-title"><span class="dot" style="background: #00e676; box-shadow: 0 0 10px #00e676;"></span> Title & SEO</div>
        </div>
        <div style="margin-bottom: 10px; font-weight: bold; color: var(--primary-2);">Title:</div>
        <div class="section-body" id="out-title" style="margin-bottom: 20px;"></div>
        
        <div style="margin-bottom: 10px; font-weight: bold; color: var(--primary-2);">Hashtags:</div>
        <div class="section-body" id="out-hashtags"></div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const state = {
    content: { idea: '', hook: '', script: '', title: '', hashtags: '' }
  };

  const el = (id) => document.getElementById(id);
  const generateBtn = el('generateBtn');
  const generateBtnLabel = el('generateBtnLabel');
  const resultsSection = el('results');
  const emptyState = el('emptyState');
  const toast = el('toast');

  // Helper for notifications
  function showToast(message) {
    toast.textContent = message;
    toast.className = 'toast show';
    setTimeout(() => { toast.className = 'toast'; }, 3000);
  }

  // Helper to show loading animation
  function setSkeleton(ids) {
    ids.forEach(id => {
      const target = el(id);
      if(target) target.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    });
  }

  // Format Hashtags cleanly
  function formatHashtags(text, containerId) {
    const container = el(containerId);
    container.innerHTML = ''; // Clear previous content safely (no user input)

    const tags = String(text || '').split(/\s+/).filter(Boolean);

    const fragment = document.createDocumentFragment();
    tags.forEach(tag => {
      const span = document.createElement('span');
      span.className = 'hashtag-chip';
      span.textContent = tag.startsWith('#') ? tag : '#' + tag;
      fragment.appendChild(span);
    });

    container.appendChild(fragment);
  }

  // Main API Call
  generateBtn.addEventListener('click', async () => {
    const topic = el('topic').value.trim();
    if (!topic) return showToast('Please enter a topic first!');

    // UI Loading state
    generateBtn.disabled = true;
    generateBtnLabel.innerHTML = '<span class="spinner"></span> Generating...';
    emptyState.style.display = 'none';
    resultsSection.classList.add('visible');
    
    setSkeleton(['out-idea', 'out-hook', 'out-script', 'out-title', 'out-hashtags']);

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          topic: topic,
          language: el('language').value,
          platform: el('platform').value,
          section: 'all'
        })
      });

      const data = await res.json();
      
      if (!res.ok) throw new Error(data.error || 'Something went wrong');

      // Populate Data
      state.content = data;
      el('out-idea').textContent = data.idea;
      el('out-hook').textContent = data.hook;
      el('out-script').textContent = data.script;
      el('out-title').textContent = data.title;
      formatHashtags(data.hashtags, 'out-hashtags');
      
      showToast('Content Generated Successfully! 🎉');

    } catch (err) {
      showToast('Error: ' + err.message);
      emptyState.style.display = 'block';
      resultsSection.classList.remove('visible');
    } finally {
      generateBtn.disabled = false;
      generateBtnLabel.textContent = '✨ Generate Viral Content';
    }
  });

  // Copy Buttons Logic
  document.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-copy');
      const textToCopy = state.content[key];
      if (textToCopy) {
        navigator.clipboard.writeText(textToCopy);
        showToast('Copied to clipboard! 📋');
      }
    });
  });

  // Character Counter
  el('topic').addEventListener('input', (e) => {
    el('topicCounter').textContent = `${e.target.value.length} / 200`;
  });
</script>
</body>
</html>
